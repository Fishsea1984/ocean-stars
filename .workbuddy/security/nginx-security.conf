# ============================================================
#  星海之境 · Nginx 安全加固规则
#  用法：宝塔面板 → 网站 → 你的站点 → 设置 → 配置文件
#        把下面的规则整段粘贴到  server { ... }  里面，保存并重载 Nginx
# ============================================================

# ---- 1) 禁止直接下载日记原始数据（页面通过 list.php 读取，不受影响）----
location ^~ /diary/data/ {
    deny all;
    return 403;
}

# ---- 2) 上传目录禁止执行任何脚本（防止图片马被解析）----
location ^~ /diary/uploads/ {
    location ~ \.php$ {
        deny all;
        return 403;
    }
}

# ---- 3) 鉴权配置目录整体拒绝访问 ----
location ^~ /_sec/ {
    deny all;
    return 403;
}

# ---- 4) AI 接口限流缓存目录拒绝访问 ----
location ^~ /ai/api/.rate/ {
    deny all;
    return 403;
}

# ---- 5) 放行证书续期，再拒绝其余隐藏文件（.git / .env / .user.ini 等）----
location ^~ /.well-known/acme-challenge/ {
    allow all;
}
location ~ /\. {
    deny all;
    return 403;
}

# ---- 6) 拒绝备份文件与危险后缀 ----
location ~* \.(sql|bak|old|tmp|zip|tar|gz|tgz|rar|7z|log|ini|sh|conf|db|sqlite|md)$ {
    deny all;
    return 403;
}

# ---- 7) 安全响应头（放在 server 块内即可）----
add_header X-Content-Type-Options  "nosniff" always;
add_header X-Frame-Options         "SAMEORIGIN" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

# 内容安全策略：站点有较多内联脚本/样式，先用较宽松策略避免破坏页面
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src https:; object-src 'none'; base-uri 'self'" always;

# ---- 8) 隐藏 Nginx 版本号（可放在 http 块，全局生效）----
# server_tokens off;
