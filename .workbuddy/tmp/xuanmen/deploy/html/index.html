,mountain:"委羽山",location:"浙江台州",guardian:"青童君",realmIndexReq:6,resource:"仙露",resourceKey:"xianlu",element:"水",desc:'号"大有空明之天"。山势如鸟委翼，青童君治之。产仙露，凝神丹之引。'},{id:"xicheng",rank:3,name:"西城山洞",mountain:"西城山",location:"陕西安康",guardian:"上宰王君",realmIndexReq:9,resource:"道元",resourceKey:"daoyuanOre",element:"金",desc:'号"太玄总真之天"。上宰王君所治，历代隐修者云集。产道元矿，符箓丹道之基。'},{id:"xixuan",rank:4,name:"西玄山洞",mountain:"西玄山",location:"蜀中",guardian:"裴君",realmIndexReq:9,resource:"丹材",resourceKey:"dancai",element:"土",desc:'号"三元极真之天"。裴君治之，山藏丹砂。产丹材，炼丹主料。'},{id:"qingcheng",rank:5,name:"青城山洞",mountain:"青城山",location:"四川都江堰",guardian:"宁封子",realmIndexReq:12,resource:"符纸",resourceKey:"fuzhi",element:"木",desc:'号"宝仙九室之天"。黄帝时宁封子于此得道，张道陵亦于此降魔传道。产符纸，绘符之基。'},{id:"chicheng",rank:6,name:"赤城山洞",mountain:"赤城山",location:"浙江天台",guardian:"王君",realmIndexReq:12,resource:"朱砂",resourceKey:"zhusha",element:"火",desc:'号"紫玉清平之天"。山色赤如霞，孙绰《游天台山赋》"赤城霞起以建标"。产朱砂，画符点睛之宝。'},{id:"luofu",rank:7,name:"罗浮山洞",mountain:"罗浮山",location:"广东惠州",guardian:"葛洪",realmIndexReq:15,resource:"古法丹方",resourceKey:"danfang",element:"火",desc:'号"朱明辉真之天"。葛稚川晚年于此结庐炼丹，洗药池、炼丹灶遗迹犹存。藏古法丹方。'},{id:"jugou",rank:8,name:"句曲山洞",mountain:"茅山",location:"江苏句容",guardian:"茅君",realmIndexReq:15,resource:"阵法图谱",resourceKey:"zhentu",element:"金",desc:'号"金坛华阳之天"。三茅真君修真之地，上清派祖庭。藏阵法图谱，布阵之本。'},{id:"linwu",rank:9,name:"林屋山洞",mountain:"林屋山",location:"江苏苏州",guardian:"龙威丈人",realmIndexReq:18,resource:"星宿图谱",resourceKey:"xingtu",element:"水",desc:'号"左神幽虚之天"。《山海经》所载洞庭之山，龙威丈人昔携《灵宝经》出此洞。藏星宿图谱。'},{id:"kuocang",rank:10,name:"括苍山洞",mountain:"括苍山",location:"浙江临海",guardian:"平仲节",realmIndexReq:18,resource:"云母仙材",resourceKey:"yunmu",element:"土",desc:'号"成德隐玄之天"。汉代仙人平仲节治之。产云母，服食炼形之上材。'}],hi={lingcao:"灵草",xianlu:"仙露",daoyuanOre:"道元矿",dancai:"丹材",fuzhi:"符纸",zhusha:"朱砂",danfang:"古法丹方",zhentu:"阵法图谱",xingtu:"星宿图谱",yunmu:"云母"},vm=e=>2.2+e*.15,xm=e=>.35+e*.03,yi=[{id:"yuanshi",name:"元始天尊",title:"玉清圣境清微天玉清元始天尊",duty:"三清之首，万仙之祖，执掌天地未判之先气",source:"《隋书·经籍志》《真灵位业图》第一阶中位",desc:'居清微天玉清境，为道教最高神。象征宇宙本源"元始"之气，开天辟地之前即已存在。每逢天地开辟，便以秘道授诸仙，谓之"开劫度人"。',parent:"dao",group:"三清",bonds:["sanqing"]},{id:"lingbao",name:"灵宝天尊",title:"上清真境禹余天上清灵宝天尊",duty:"三清之二，手持太极图或玉如意，象征混沌始判、阴阳初分",source:"《真灵位业图》《道教三洞宗元》",desc:'居禹余天上清境。相传其于宇宙化生中以"灵宝之法"度人无量，故称灵宝。道教灵宝派尊奉其为主神，主掌经宝。',parent:"dao",group:"三清",bonds:["sanqing"]},{id:"daode",name:"道德天尊",title:"太清仙境大赤天太清道德天尊",duty:"三清之三，即太上老君，化身老子著《道德经》，主掌道宝",source:"《老子想尔注》《魏书·释老志》",desc:"居大赤天太清境，即道教尊神太上老君。史称老子，姓李名耳，字聃，周守藏室之史。著《道德经》五千言，为道教根本经典。历代多有显圣化度之事。",parent:"dao",group:"三清",bonds:["sanqing"]},{id:"yuhuang",name:"玉皇大帝",title:"昊天金阙至尊玉皇大天尊玄穹高上帝",duty:"四御之首，总执天道三界十方、四生六道之政",source:"《高上玉皇本行集经》",desc:'居于昊天金阙弥罗宫，为三界十方万灵之主宰。民间尊称"天公"，正月初九为玉皇圣诞。掌管三界十方四生六道的祸福吉凶。',parent:"daode",group:"四御",bonds:["siyu"]},{id:"ziwei",name:"紫微大帝",title:"中天紫微北极大皇大帝",duty:"执掌天经地纬、日月星辰与四时气候，统率三界星神",source:"《北斗本命延生真经》",desc:'全称"中天紫微北极大帝"，居紫微宫（北极星垣）。道教尊为"众星之主"，协助玉皇执掌天经地纬、星辰运转与四时祸福。',parent:"daode",group:"四御",bonds:["siyu"]},{id:"gouchen",name:"勾陈大帝",title:"勾陈上宫天皇大帝",duty:"执掌南北二极与天、地、人三才，统御众星，主持兵戈",source:"《晋书·天文志》《道法会元》",desc:"居勾陈上宫，位同北极。协助玉皇执掌南北两极与天地人三才，统御诸星并主持人间兵革之事。",parent:"daode",group:"四御",bonds:["siyu"]},{id:"houtu",name:"后土皇地祇",title:"承天效法厚德光大后土皇地祇",duty:"执掌阴阳生育、万物之美与大地山河",source:"《宋史·礼志》",desc:'四御中唯一女相大神，尊称"后土娘娘"。玉皇统天，后土御地，与玉皇相配，掌大地山川、阴阳生育，为大地之母。',parent:"daode",group:"四御",bonds:["siyu"]},{id:"tianguan",name:"天官大帝",title:"上元九气赐福天官曜灵元阳大帝",duty:"上元一品赐福天官，正月十五校定人间罪福",source:"《三官灯仪》《元始天尊说三官宝号经》",desc:'三官之首，居青华阙下。民间"天官赐福"之说即源于此。每逢上元节（正月十五）降临人间，校定罪福，赐福万民。',parent:"ziwei",group:"三官",bonds:["sanguan"]},{id:"diguan",name:"地官大帝",title:"中元七气赦罪地官洞灵清虚大帝",duty:"中元二品赦罪地官，七月十五赦免亡魂罪愆",source:"《三官灯仪》",desc:"中元节（七月十五）地官校籍，赦罪解愆。道教于此日设中元斋，普度孤魂，为亡者赦罪祈福。",parent:"ziwei",group:"三官",bonds:["sanguan"]},{id:"shuiguan",name:"水官大帝",title:"下元五气解厄水官洞阴大帝",duty:"下元三品解厄水官，十月十五为困厄者解灾",source:"《三官灯仪》",desc:'下元节（十月十五）水官解厄，为众生解除灾厄困苦。三官信仰源于东汉天师道"三官手书"请祷之法。',parent:"ziwei",group:"三官",bonds:["sanguan"]},{id:"doumu",name:"斗姆元君",title:"中天梵气斗姆元君紫光金尊",duty:"众星之母，北斗九皇之母，主掌生命寿夭",source:"《太上玄灵斗姆大圣元君本命延生心经》",desc:"为北斗众星之母，诞九子：天皇大帝、紫微大帝与北斗七元星君。道教斗姆信仰主延生保命，礼斗法事（拜斗）即祈求斗姆与北斗星君延寿解厄。",parent:"ziwei",group:"星宿",bonds:["dougu"]},{id:"zhenwu",name:"真武大帝",title:"镇天真武灵应佑圣真君玄天上帝",duty:"镇守北方，统摄玄武之位，主司水火、斩妖伏魔",source:"《元始天尊说北方真武妙经》",desc:"又称玄天上帝、荡魔天尊。原为净乐国太子，入武当山修道四十二年功成飞升。披发跣足、脚踏龟蛇，为北方守护之神。明代因皇室崇奉而地位极隆。",parent:"ziwei",group:"星宿",bonds:[]},{id:"wenchang",name:"文昌帝君",title:"九天开化主宰司禄职贡举真君",duty:"主掌文运功名、禄籍科举，天下士子之守护神",source:"《文昌帝君阴骘文》",desc:'掌理禄籍，主文运。历代读书人多于科举前拜文昌。《阴骘文》劝人"广行阴骘，上格苍穹"，为道教劝善经典。',parent:"ziwei",group:"星宿",bonds:[]},{id:"leizu",name:"雷声普化天尊",title:"九天应元雷声普化天尊",duty:"总司五雷，执掌雷部，赏善罚恶",source:"《九天应元雷声普化天尊玉枢宝经》",desc:"居神霄玉府，统御雷部三十六将。执掌五雷斩勘之权，代天行诛。其《玉枢经》为道士召雷炼将的根本经典。",parent:"gouchen",group:"星宿",bonds:[]},{id:"taiyi",name:"太乙救苦天尊",title:"青华救苦青玄九阳上帝",duty:"寻声救苦，超度幽冥，接引亡魂往生东方长乐世界",source:"《太乙救苦护身妙经》",desc:"居东方青华长乐界，骑九头狮子。道教称其寻声赴感，十方世界若有苦难称其名号，天尊即化身救度。度亡法事多奉为主神。",parent:"gouchen",group:"星宿",bonds:[]},{id:"dongyue",name:"东岳大帝",title:"东岳泰山天齐仁圣大帝",duty:"执掌人间生死贵贱，统领五岳及幽冥地府",source:"《东岳大帝本行经》",desc:"泰山神，主掌人之寿命与魂魄。古代帝王封禅泰山，即祭告东岳。道教称其统领五岳山神与地府七十二司。",parent:"houtu",group:"山川",bonds:[]},{id:"yanluo",name:"酆都大帝",title:"北阴酆都大帝",duty:"统管酆都幽冥地府，考校鬼魂罪福",source:"《真诰》《太平广记》",desc:"道教幽冥世界主宰，居北阴酆都（罗酆山）。统辖五方鬼帝、十殿阎罗，主司考校幽魂、执掌轮回赏罚。化神境方可参悟地府谱系。",parent:"houtu",group:"山川",bonds:[]},{id:"mazu",name:"妈祖",title:"天上圣母碧霞元君",duty:"护佑海运、济度众生，沿海信众之守护神",source:"《天妃显圣录》",desc:'本名林默，宋代福建湄洲人，生前为巫，通医理善航海救助，殁后立庙奉祀。历代朝廷褒封由"夫人""妃"至"天妃""天后"，为道教重要水神。',parent:"houtu",group:"山川",bonds:[]},{id:"caishen",name:"赵公明",title:"金龙如意正一龙虎玄坛真君",duty:"正财神，掌赏罚诉讼、买卖求财",source:"《真诰》《搜神记》《封神演义》",desc:"道教正财神。原为皓庭霄度天慧觉昏梵气所化，张道陵天师弟子，守护丹室有功。骑黑虎、执银鞭，统招宝、纳珍、招财、利市四神。",parent:"yuhuang",group:"山川",bonds:[]},{id:"tieli",name:"铁拐李",title:"紫金团惠真君",duty:"八仙之首，蓬头虬髯，跛足拄铁拐，背宝葫芦",source:"《列仙全传》《东游记》",desc:"相传本名李玄，遇太上老君得道。元神出窍游历，肉身误被徒弟焚化，归来无所依，附一饿殍之躯而起，遂成跛足铁拐之相。葫芦中藏济世仙丹。",parent:"dao",group:"八仙",bonds:["baxian"]},{id:"zhongli",name:"汉钟离",title:"正阳开悟传道真君",duty:"八仙之一，袒胸露乳，摇棕扇，传吕洞宾丹法",source:"《宣和书谱》《列仙全传》",desc:"姓钟离名权，字云房，汉代大将。兵败入山遇东华帝君得道。为道教北五祖之一（正阳祖师），吕洞宾之师。常摇宝扇，点化世人。",parent:"dao",group:"八仙",bonds:["baxian"]},{id:"guolao",name:"张果老",title:"通玄先生",duty:"八仙之一，倒骑白驴，通晓长寿秘术",source:"《旧唐书》《明皇杂录》",desc:'唐代著名道士，自言尧时人。武则天、唐玄宗屡召入宫，演法万千。常倒骑白驴，日行数万里，休则折叠藏于巾箱。玄宗赐号"通玄先生"。',parent:"dao",group:"八仙",bonds:["baxian"]},{id:"dongbin",name:"吕洞宾",title:"纯阳演正警化真君",duty:'八仙之一，佩剑背剑，全真北五祖之一，号"剑仙""诗仙"',source:"《宋史·陈抟传》《吕祖全书》",desc:'字洞宾，号纯阳子，唐代人。两举进士不第，遇钟离权以"黄粱一梦"点化，授大道天遁剑法。发愿"度尽世间方上仙"。元世祖封"纯阳演正警化真君"。',parent:"zhongli",group:"八仙",bonds:["baxian","shifangxian"]},{id:"xiangu",name:"何仙姑",title:"慈济宝诰长春真君",duty:"八仙之一，持荷花，唯一女仙",source:"《历代神仙通鉴》",desc:"唐代广州增城人，十三岁入山采茶，遇仙人食仙桃，自此不饥不渴，洞知人事休咎。手持荷花，为八仙中唯一女仙。",parent:"dao",group:"八仙",bonds:["baxian"]},{id:"lancaihe",name:"蓝采和",title:"光慈妙乐真君",duty:"八仙之一，提花篮，行歌于市",source:"《续仙传》",desc:"常衣破蓝衫，一脚着靴一脚跣，手拍大板，醉行歌于市。歌词多仙意，人莫能测。后于濠梁间酒楼乘鹤飞升。",parent:"dao",group:"八仙",bonds:["baxian"]},{id:"hanxiang",name:"韩湘子",title:"玄妙真君",duty:"八仙之一，吹紫金箫，擅造化之术",source:"《酉阳杂俎》《韩湘子全传》",desc:'唐代韩愈之侄孙。少慕仙道，遇吕洞宾学道。曾于数日内令牡丹花开数色，预谪官之谶。手中紫金箫，为八仙中之"仙乐"。',parent:"dao",group:"八仙",bonds:["baxian"]},{id:"caoguojiu",name:"曹国舅",title:"黄玄惠慈冲应真君",duty:"八仙之一，执玉板（阴阳板）",source:"《神仙通鉴》",desc:"宋仁宗曹皇后之弟，因耻于其弟作恶，散财济贫，隐迹山岩修道。遇钟离权与吕洞宾，得授还真秘术。执玉板为宝。",parent:"dao",group:"八仙",bonds:["baxian"]},{id:"zhangdaoling",name:"张道陵",title:"祖天师泰玄上相正一冲玄神化静应显佑真君",duty:'正一道创始人，创二十四治，授"三官手书"',source:"《汉天师世家》《魏书·释老志》",desc:'东汉沛国人，本太学生，弃儒入道，于鹤鸣山得太上老君授"三天正法"，创五斗米道。设二十四治以道民，尊为道教创教祖天师。其子孙世居龙虎山，世袭天师之职。',parent:"yuhuang",group:"天师",bonds:["sitianshi"]},{id:"gexuan",name:"葛玄",title:"太极仙翁冲应真君",duty:"灵宝派祖师，授《灵宝经》篆",source:"《抱朴子》《神仙传》",desc:'三国吴人，葛洪之从祖父，世称"葛仙翁"或"太极仙翁"。得左慈传《太清丹经》，于閤皂山修道，为道教灵宝派及閤皂山之祖师。',parent:"yuhuang",group:"天师",bonds:["sitianshi"]},{id:"xuxun",name:"许逊",title:"净明普度天尊感天大帝",duty:'净明道祖师，斩蛟治水，"一人得道，鸡犬升天"',source:"《云笈七签》《孝道吴许二真君传》",desc:'晋代道士，字敬之。曾任旌阳县令，人称"许旌阳"。弃官归隐修道，于江西斩蛟除害。传说其一百三十六岁携全家四十二口"拔宅飞升"，鸡犬随之，即成语"一人得道，鸡犬升天"之出处。',parent:"yuhuang",group:"天师",bonds:["sitianshi"]},{id:"sashoujian",name:"萨守坚",title:"崇恩真君",duty:"神霄派宗师，精雷法咒枣济世",source:"《历世真仙体道通鉴》",desc:"宋代道士，号全阳子。学神霄雷法于王文卿，以咒枣济贫、雷法灭疫闻名。其弟子王灵官后为道教第一护法。",parent:"yuhuang",group:"天师",bonds:["sitianshi"]},{id:"weihuacun",name:"魏华存",title:"紫虚元君南岳夫人",duty:"上清派开派宗师，《黄庭经》传世",source:"《真诰》《魏夫人传》",desc:'西晋女道士，字贤安。任城樊人，司徒魏舒之女。持斋修道，感众真下降，授《上清大洞真经》，开上清派一脉，为道教史上最著名女宗师，世称"南岳夫人"。',parent:"daode",group:"仙真",bonds:[]},{id:"gehong",name:"葛洪",title:"抱朴子稚川真人",duty:"丹鼎派集大成者，著《抱朴子》《肘后备急方》",source:"《晋书·葛洪传》《抱朴子·内篇》",desc:'东晋道学家、医药学家。自号抱朴子，从郑隐受炼丹经诀，携子侄至罗浮山炼丹著述。《抱朴子·内篇》为道教神仙理论体系奠基之作，"我命在我不在天"之名言即出此书。',parent:"gexuan",group:"仙真",bonds:["luofu"]},{id:"taohongjing",name:"陶弘景",title:"华阳隐居贞白先生",duty:'上清派宗师，著《真灵位业图》，"山中宰相"',source:"《梁书·陶弘景传》《真诰》",desc:'南朝齐梁时道士，字通明，自号华阳隐居。梁武帝每有吉凶征讨大事必往咨询，时人谓之"山中宰相"。所撰《真灵位业图》首开道教神仙谱系排序之先河，将七百余位神仙分为七阶。',parent:"weihuacun",group:"仙真",bonds:[]},{id:"chentuan",name:"陈抟",title:"希夷先生扶摇子",duty:"睡仙，传先天图学与无极图，启宋代理学",source:"《宋史·陈抟传》",desc:'五代宋初道士，字图南，号扶摇子。隐武当九室岩、华山云台观，一睡可数月，人称"睡仙"。传先天太极图，周敦颐、邵雍之学皆受其影响。宋太宗赐号"希夷先生"。',parent:"daode",group:"仙真",bonds:[]},{id:"wangchongyang",name:"王重阳",title:"重阳全真开化辅极帝君",duty:'全真道创始人，于终南山"活死人墓"修道',source:"《金莲正宗记》《甘水仙源录》",desc:'金代道士，名喆，号重阳子。正隆年间在终南山掘地自居，称"活死人墓"，悟道出家。后于山东传道，收马钰、丘处机等七真，创全真道。主张三教合流，出家修行。',parent:"daode",group:"仙真",bonds:["quanzhen"]},{id:"qiuchuji",name:"丘处机",title:"长春演道主教真人",duty:"龙门派祖师，一言止杀，雪山论道",source:"《长春真人西游记》《元史·释老传》",desc:'金末元初道士，号长春子，王重阳七真之一。七十四岁高龄率弟子西行万里赴西域，劝成吉思汗"敬天爱民、减少屠杀"，史称"一言止杀"。创全真龙门派，影响至今。',parent:"wangchongyang",group:"仙真",bonds:["quanzhen"]},{id:"zhangsanfeng",name:"张三丰",title:"通微显化真人犹龙六祖",duty:"武当派祖师，创太极拳十三式",source:"《明史·方伎传》《三丰全集》",desc:"元末明初道士。龟形鹤背，寒暑只一衲一蓑。于武当山结庐修道，观蛇鹊相斗悟出以柔克刚之理，创太极拳十三式。明成祖屡诏不赴，大修武当以示崇奉。",parent:"zhenwu",group:"仙真",bonds:[]}],ma=[{id:"sanqing",name:"三清一体",desc:"玉清、上清、太清三位一体，道之三元显化",members:["yuanshi","lingbao","daode"],bonus:"全体资源产出 + 5%",realmReq:"至尊境"},{id:"siyu",name:"四御拱卫",desc:"四御辅佐三清，代天行化，执掌乾坤",members:["yuhuang","ziwei","gouchen","houtu"],bonus:"挂机倍率 + 8%",realmReq:"金仙境"},{id:"baxian",name:"八仙过海",desc:'八仙各显神通，宝器渡沧海，"八仙过海，各显神通"',members:["tieli","zhongli","guolao","dongbin","xiangu","lancaihe","hanxiang","caoguojiu"],bonus:"符箓评分容差 + 5%，渡劫提示 ',source:"《度人经》"},{id:"obj-38",type:"objective",q:'"仙道贵生，无量度人"出自？',options:["《度人经》","《道德经》","《南华真经》","《太平经》"],answer:0,analysis:"《度人经》开篇宗义，道教济世度人精神的总纲。",source:"《度人经》"},{id:"obj-39",type:"objective",q:"龙虎山是道教哪个宗派的祖庭？",options:["正一道","全真道","上清派","净明道"],answer:0,analysis:"张道陵后裔世居江西龙虎山，世袭天师，为正一道祖庭。",source:"《汉天师世家》"},{id:"obj-40",type:"objective",q:"武当山主要供奉的主神是？",options:["真武大帝","吕洞宾","三茅真君","东岳大帝"],answer:0,analysis:"武当山（太和山）为真武大帝道场，明代皇室大修武当以崇奉真武。",source:"《大岳太和山志》"},{id:"obj-41",type:"objective",q:"青城山与哪位天师的传道活动关系最密切？",options:["张道陵","葛玄","萨守坚","丘处机"],answer:0,analysis:"张道陵曾在青城山降魔传道，青城山为天师道发祥地之一。",source:"《青城山记》"},{id:"obj-42",type:"objective",q:'被称为"天下第一福地"的楼观台在哪个省？',options:["陕西","河南","山西","四川"],answer:0,analysis:"楼观台在陕西周至，相传尹喜在此观星望气、迎老子说经。",source:"《楼观本纪》"},{id:"obj-43",type:"objective",q:"玉皇大帝的圣诞（生日）是农历哪一天？",options:["正月初九","正月十五","二月十五","腊月廿五"],answer:0,analysis:'正月初九"天公生"即玉皇圣诞；二月十五为老君圣诞。',source:"民间道门通例"},{id:"obj-44",type:"objective",q:"太上老君的圣诞（生日）是农历哪一天？",options:["二月初二","二月十五","三月初三","九月九日"],answer:1,analysis:'农历二月十五为太上老君圣诞，又称"降圣节"。',source:"道门通例"},{id:"obj-45",type:"objective",q:"农历七月十五中元节，是哪位神明校籍赦罪之日？",options:["天官","地官","水官","雷官"],answer:1,analysis:"中元为地官赦罪之辰，故中元节设斋普度亡魂。",source:"《三官灯仪》"},{id:"obj-46",type:"objective",q:"女道士在道教中的规范称谓是？",options:["坤道","乾道","女冠（女黄冠）","道姑"],answer:0,analysis:'规范称谓为"坤道"（男为乾道），"道姑"为俗称。',source:"道门通例"},{id:"obj-47",type:"objective",q:"正一道与全真道的重要区别之一是？",options:["正一不必出家可婚娶","正一不奉三清","全真可以饮酒","全真不诵经典"],answer:0,analysis:"正一派道士多居家、可婚娶（天师世代承袭），全真派则出家住观、素食独身。",source:"《大明玄教立成斋醮仪》"},{id:"obj-48",type:"objective",q:"罗浮山第七洞天的镇守真仙是？",options:["葛洪","茅盈","宁封子","平仲节"],answer:0,analysis:'罗浮山洞号"朱明辉真之天"，葛洪晚年于此炼丹著述。',source:"《天地宫府图》"},{id:"obj-49",type:"objective",q:"茅山（句曲山洞）因哪三位真人得名？",options:["茅盈、茅固、茅衷","三张天师","三茅真君与二许","魏华存三弟子"],answer:0,analysis:"西汉三茅真君（茅盈、茅固、茅衷）修道于此，山因人名。",source:"《茅山志》"},{id:"obj-50",type:"objective",q:'被后世尊为"药王"、著有《千金方》的道士是？',options:["孙思邈","葛洪","陶弘景","鲍姑"],answer:0,analysis:'唐代道士孙思邈著《千金要方》《千金翼方》，宋崇宁间封"妙应真人"。',source:"《 入圣之道，须是苦志多年，积功累行。`,thought:'主张三教合一（"儒门释户道相通"），出家住观、乞食炼心，将丹法与戒行、功行并举，开全真家风。'}],jh=[{id:"s-zhouzhou",title:"庄周梦蝶",era:"战国",text:"庄周梦为蝴蝶，栩栩然蝴蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为蝴蝶与，蝴蝶之梦为周与？周与蝴蝶，则必有分矣。此之谓物化。",source:"《庄子·齐物论》"},{id:"s-ziqixi",title:"紫气东来",era:"春秋",text:"关令尹喜善望气，一日登楼四望，见东方有紫气西迈，知有圣人过关。果见老人骑青牛徐徐而来，乃老子也。尹喜拜迎，执弟子礼，请著书。老子遂著《道德经》五千言而去，莫知所终。",source:"《列仙传》"},{id:"s-huangliang",title:"黄粱一梦",era:"唐 · 钟离权度吕洞宾",text:"吕洞宾两举进士不第，于长安酒肆遇钟离权。钟离为其炊黄粱饭，洞宾伏枕而寐，梦中历尽拜相封侯、荣辱得失、家破人散，五十年一觉醒来，黄粱尚未熟。洞宾大悟，遂求度世之术。",source:"《吕祖全书》"},{id:"s-yiren",title:"一人得道，鸡犬升天",era:"东晋",text:'许逊居官旌阳，后弃官修道，斩蛟除害，豫章人立祠祀之。相传其一百三十六岁时，天降仙官来迎，全家四十二口连同屋宅拔地飞升，连鸡犬也随之上天——"一人得道，鸡犬升天"由此而来。',source:"《孝道吴许二真君传》"},{id:"s-baxian",title:"八仙过海",era:"元明",text:'八仙赴蟠桃大会归途，遇东海阻隔，吕洞宾言"各显神通过之"：铁拐李掷杖、汉钟离揭扇、张果老骑驴踏浪、吕洞宾乘剑、何仙姑立荷、蓝采和踏板、韩湘子吹箫引鹤、曹国舅拍板——"八仙过海，各显神通"。',source:"《东游记》"},{id:"s-yandao",title:"一言止杀",era:"元",text:'丘处机七十二岁应成吉思汗之邀，率弟子万里西行至雪山。大汗问长生之道，丘祖对曰："世上只有卫生之道，而无长生之药。"又进言"敬天爱民为本，减少屠杀为要"。大汗深契其言，称其"神仙"，止杀者众。',source:"《长春真人西游记》"},{id:"s-zuoshi",title:"山中宰相",era:"南朝梁",text:'陶弘景隐居茅山（句曲山），梁武帝即位后屡加礼聘，坚辞不出。然国家每有吉凶征讨大事，无不前以咨询，月中常有数信。时人谓之"山中宰相"。',source:"《梁书·陶弘景传》"},{id:"s-wo",title:"陈抟高卧",era:"五代宋初",text:'陈抟隐居武当九室岩服气辟谷，一睡可月余不起，人称"睡仙"。后周世宗问以黄白之术，对曰："陛下为四海之主，当以致治为念，奈何留意黄白之事乎？"世宗命为谏议大夫，固辞不受，赐号"白云先生"。',source:"《宋史·陈抟传》"}],kh=[{id:"p-wujie",title:"老君五戒",detail:"不杀生（全仁）、不偷盗（全义）、不邪淫（全礼）、不妄语（全信）、不荤酒（全智）。五戒配五常，为入道第一戒，凡童蒙初入道门先受此戒。持之则气正神清。"},{id:"p-xiangjie",title:"想尔九戒",detail:'《老子想尔注》所出：行无为、行柔弱、行守雌勿先动等九戒。天师道以"九戒"配合"三官手书"请祷之法，教民悔过奉道。'},{id:"p-180",title:"老君说一百八十戒",detail:'天师道祭酒所受大戒，自"不得多畜仆妾"至"不得轻慢师长"共一百八十条，涵盖行为、言语、心念之细目，为中古道教最详之戒律。魏晋南北朝道官非受此戒不得领民化户。'},{id:"p-santan",title:"三坛大戒",detail:"全真出家戒坛：初真戒（皈依三宝，持五戒）、中极戒（三坛之中枢，戒目三百）、天仙大戒（最高戒，直指心性圆满）。受戒次第如登楼，全真丛林传戒之制沿用至今。"},{id:"p-zhai",title:"持斋本义",detail:'斋者，齐也——齐其外先齐其内，斋其口先斋其心。道教斋法有：清心斋、素食斋、节食斋。本义在"澄心涤虑、与道合真"，若徒守口腹之戒而心念纷飞，是为守末忘本。'},{id:"p-xu",title:"忏悔之法",detail:'天师道创"三官手书"：请祷者书己罪过一式三份，一上天天官、一埋地地官、一沉水水官。首过悔改、誓不再犯，则病者得愈。道教首重"发露忏悔"，与佛家"发露"同其精神。'}],Nh=[{key:"jing",name:"道藏经书"},{key:"story",name:"仙真典故
