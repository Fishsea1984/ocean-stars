<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时新闻 - 星海之境</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700;900&family=Cinzel:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
.news-container {
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
}

/* 顶部刷新栏 */
.news-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  padding: 1.2rem 0;
  margin-bottom: 0.5rem;
}

.news-header-info {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.news-header-icon {
  font-size: 1.8rem;
}

.news-header-text h3 {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.1rem;
  color: var(--text-primary);
  margin: 0;
}

.news-header-text span {
  font-size: 0.78rem;
  color: var(--text-secondary);
  opacity: 0.7;
}

.news-refresh-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 20px;
  border: 1px solid rgba(0, 240, 255, 0.3);
  border-radius: 50px;
  background: rgba(0, 240, 255, 0.06);
  color: var(--bioluminescent);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}

.news-refresh-btn:hover {
  background: rgba(0, 240, 255, 0.15);
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
}

.news-refresh-btn.loading {
  opacity: 0.6;
  pointer-events: none;
}

.news-refresh-btn .spinner {
  display: none;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(0, 240, 255, 0.3);
  border-top-color: var(--bioluminescent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.news-refresh-btn.loading .spinner {
  display: inline-block;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* 新闻列表 */
.news-list {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.news-item {
  display: flex;
  gap: 1.2rem;
  padding: 1.1rem 1.3rem;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  backdrop-filter: blur(20px);
  transition: all 0.35s;
  text-decoration: none;
  color: inherit;
  align-items: flex-start;
}

.news-item:hover {
  border-color: rgba(0, 240, 255, 0.2);
  box-shadow: var(--accent-glow);
  transform: translateX(4px);
}

.news-item-source {
  flex-shrink: 0;
  min-width: 72px;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 0.7rem;
  font-weight: 600;
  text-align: center;
  margin-top: 2px;
  letter-spacing: 0.5px;
}

.news-item-source.people { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
.news-item-source.xinhua { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
.news-item-source.gov { background: rgba(16, 185, 129, 0.15); color: #10b981; }
.news-item-source.shanxi { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
.news-item-source.default { background: rgba(0, 240, 255, 0.1); color: var(--bioluminescent); }

.news-item-body {
  flex: 1;
  min-width: 0;
}

.news-item-title {
  font-size: 0.95rem;
  font-weight: 500;
  line-height: 1.5;
  color: var(--text-primary);
  margin-bottom: 0.35rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.news-item-summary {
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 0.35rem;
}

.news-item-meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.72rem;
  color: var(--text-secondary);
  opacity: 0.6;
}

/* 加载状态 */
.news-loading {
  text-align: center;
  padding: 3rem;
  color: var(--text-secondary);
}

.news-loading .dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 1rem;
}

.news-loading .dots span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--bioluminescent);
  opacity: 0.4;
  animation: dotBounce 1.4s infinite;
}

.news-loading .dots span:nth-child(2) { animation-delay: 0.2s; }
.news-loading .dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotBounce {
  0%, 60%, 100% { opacity: 0.4; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-6px); }
}

/* 空状态 */
.news-empty {
  text-align: center;
  padding: 3rem;
  color: var(--text-secondary);
}

.news-empty-icon {
  font-size: 3rem;
  margin-bottom: 1rem;
  opacity: 0.5;
}

/* 底部更新时间 */
.news-update-time {
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-secondary);
  opacity: 0.5;
  padding: 1.5rem 0 0.5rem;
}

/* 分页 */
.news-pagination {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  padding: 2rem 0 1rem;
}

.news-page-btn {
  padding: 8px 16px;
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  background: var(--glass-bg);
  color: var(--text-secondary);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}

.news-page-btn:hover {
  border-color: var(--bioluminescent);
  color: var(--bioluminescent);
}

.news-page-btn.active {
  border-color: var(--bioluminescent);
  color: var(--bioluminescent);
  background: rgba(0, 240, 255, 0.1);
}

.news-page-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* 响应式 */
@media (max-width: 768px) {
  .news-item {
    flex-direction: column;
    gap: 0.5rem;
    padding: 1rem;
  }
  .news-item-source {
    min-width: auto;
  }
  .news-header-bar {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>
<body>
<canvas id="universe"></canvas>
<div class="ocean-gradient"></div>
<div class="water-ripple"></div>

<div class="content">
  <nav>
    <a href="../index.html" class="logo">星海之境</a>
    <ul class="nav-links">
      <li><a href="../index.html">首页</a></li>
      <li><a href="../xuanmen/index.html">玄门问道</a></li>
      <li><a href="../diary/index.html">日记</a></li>
      <li><a href="../records/index.html">记录</a></li>
      <li><a href="../posts/articles.html">文章</a></li>
      <li><a href="../index.html#about">关于</a></li>
    </ul>
  </nav>

  <div class="breadcrumb">
    <a href="../index.html">首页</a>
    <span class="sep">/</span>
    <span class="current">实时新闻</span>
  </div>

  <div class="page-top-spacer"></div>

  <div class="page-hero">
    <span class="page-hero-label">Live News</span>
    <h1 class="page-hero-title">📰 实时新闻</h1>
    <p class="page-hero-desc">聚合长治政策动态与民生热点，实时掌握城市更新与征收补偿最新资讯</p>
  </div>

  <div class="page-body">
    <div class="news-container">
      <div class="news-header-bar">
        <div class="news-header-info">
          <div class="news-header-icon">📡</div>
          <div class="news-header-text">
            <h3>实时新闻聚合</h3>
            <span id="updateTime">加载中...</span>
          </div>
        </div>
        <button class="news-refresh-btn" onclick="refreshNews()">
          <span class="spinner"></span>
          🔄 刷新新闻
        </button>
      </div>

      <div class="news-list" id="newsList">
        <div class="news-loading">
          <p>正在加载新闻...</p>
          <div class="dots"><span></span><span></span><span></span></div>
        </div>
      </div>

      <div class="news-pagination" id="newsPagination"></div>

      <div class="news-update-time" id="cacheInfo"></div>
    </div>
  </div>

  <footer>
    <p class="footer-text">星海之境 | Ocean of Stars</p>
    <p class="footer-text">在星空与海洋的交汇处，遇见无限可能</p>
  <p class="footer-beian">

  </p>
  <p class="footer-beian footer-gaba">
      <img src="../images/gaba.svg" alt="公安备案" class="gaba-icon">
      <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=14040302000255" target="_blank" rel="noopener noreferrer">晋公网安备 14040302000255号</a>
  </p>
  </footer>
</div>

<script src="../js/main.js"></script>
<script>
let allNews = [];
let currentPage = 1;
const PAGE_SIZE = 15;

// 加载新闻
async function loadNews(force = false) {
  const list = document.getElementById('newsList');
  const btn = document.querySelector('.news-refresh-btn');
  const timeEl = document.getElementById('updateTime');

  btn.classList.add('loading');
  list.innerHTML = `
    <div class="news-loading">
      <p>正在加载新闻...</p>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>`;

  try {
    // 纯静态站点：直接读取仓库内的静态数据（由 GitHub Actions 定时更新）
    const url = force ? `news.json?t=${Date.now()}` : 'news.json';
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    // 处理错误响应
    if (data.error) {
      allNews = data.fallback || [];
      if (allNews.length === 0) {
        list.innerHTML = `
          <div class="news-empty">
            <div class="news-empty-icon">📡</div>
            <p>新闻源暂时不可用</p>
            <p style="font-size:0.8rem;margin-top:0.5rem;">所有RSS源均无法访问，请稍后重试</p>
          </div>`;
        timeEl.textContent = '新闻源不可用';
        btn.classList.remove('loading');
        return;
      }
    } else {
      allNews = data;
    }

    if (allNews.length === 0) {
      list.innerHTML = `
        <div class="news-empty">
          <div class="news-empty-icon">📡</div>
          <p>暂无新闻数据</p>
          <p style="font-size:0.8rem;margin-top:0.5rem;">请点击刷新按钮重试</p>
        </div>`;
      timeEl.textContent = '暂无数据';
    } else {
      currentPage = 1;
      renderPage();
      timeEl.textContent = `共 ${allNews.length} 条新闻 · 每10分钟自动更新`;
    }

    // 显示缓存时间
    const now = new Date();
    document.getElementById('cacheInfo').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

  } catch (e) {
    list.innerHTML = `
      <div class="news-empty">
        <div class="news-empty-icon">⚠️</div>
        <p>加载失败</p>
        <p style="font-size:0.8rem;margin-top:0.5rem;">请检查网络连接或刷新重试</p>
      </div>`;
    timeEl.textContent = '加载失败';
  } finally {
    btn.classList.remove('loading');
  }
}

// 渲染当前页
function renderPage() {
  const list = document.getElementById('newsList');
  const totalPages = Math.ceil(allNews.length / PAGE_SIZE);
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageNews = allNews.slice(start, start + PAGE_SIZE);

  list.innerHTML = pageNews.map(item => {
    const sourceClass = getSourceClass(item.source);
    return `
      <a href="${item.url}" target="_blank" rel="noopener" class="news-item">
        <span class="news-item-source ${sourceClass}">${item.source}</span>
        <div class="news-item-body">
          <div class="news-item-title">${item.title}</div>
          ${item.summary !== item.title ? `<div class="news-item-summary">${item.summary}</div>` : ''}
          <div class="news-item-meta">
            <span>🕐 ${item.date}</span>
          </div>
        </div>
      </a>`;
  }).join('');

  // 渲染分页
  renderPagination(totalPages);
}

// 渲染分页
function renderPagination(totalPages) {
  const pag = document.getElementById('newsPagination');
  if (totalPages <= 1) {
    pag.innerHTML = '';
    return;
  }

  let html = `<button class="news-page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← 上一页</button>`;

  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
      html += `<button class="news-page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
    } else if (i === currentPage - 3 || i === currentPage + 3) {
      html += `<span style="color:var(--text-secondary);padding:8px 4px;">...</span>`;
    }
  }

  html += `<button class="news-page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页 →</button>`;

  pag.innerHTML = html;
}

// 翻页
function goPage(page) {
  const totalPages = Math.ceil(allNews.length / PAGE_SIZE);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  document.getElementById('newsList').scrollIntoView({ behavior: 'smooth', block: 'start' });
  renderPage();
}

// 刷新
function refreshNews() {
  loadNews(true);
}

// 获取来源样式
function getSourceClass(source) {
  if (source.includes('人民')) return 'people';
  if (source.includes('新华')) return 'xinhua';
  if (source.includes('山西')) return 'shanxi';
  if (source.includes('政府') || source.includes('政务') || source.includes('长治')) return 'gov';
  return 'default';
}

// 初始化
loadNews();
</script>
</body>
