# ==========================================================================
#  星海之境 · Nginx 安全加固配置片段
#  适用：天翼云 + 宝塔面板（Nginx）
#
#  使用方法（宝塔）：
#    网站 → 设置 → 配置文件
#    ① 【http{} 段】把下面「A. 限流定义」粘到 server{} 之前（约第 6~15 行处）
#    ② 【server{} 段】把「B. 站点防护」粘到 server{ ... } 内部靠上的位置
#    ③ 保存后重载 Nginx
#
#  ⚠ 注意：enable-php-80.conf 需按你实际安装的 PHP 版本改（74/80/81/82）
# ==========================================================================

# --------------------------------------------------------------------------
# A. 限流定义（放在 http{ } 内，server 之外）
# --------------------------------------------------------------------------
# 存档接口：每个 IP 每分钟最多 10 次
limit_req_zone $binary_remote_addr zone=xm_api:10m rate=10r/m;
# 全站：每个 IP 每秒最多 30 次请求，防刷
limit_req_zone $binary_remote_addr zone=site:10m rate=30r/s;
# 单 IP 并发连接数
limit_conn_zone $binary_remote_addr zone=perip:10m;

# --------------------------------------------------------------------------
# B. 站点防护（放在 server{ } 内）
# --------------------------------------------------------------------------

# 1) 关闭目录列表（防止被人把整站文件列出来下载）
autoindex off;

# 2) 敏感目录一律拒绝（这些目录根本不该出现在公网）
location ~ /\.(git|svn|htaccess|env|workbuddy) {
    deny  all;
    access_log off;
    log_not_found off;
}
location ~ ^/(server-api|scripts|functions|\.github|\.rate)/ {
    deny  all;
    access_log off;
}

# 3) 存档数据目录禁止直接下载
location ~ ^/xuanmen-save/(saves|\.rate)/ {
    deny  all;
    access_log off;
}

# 4) 上传目录禁止执行任何脚本（防 webshell 落地执行）
location ~* ^/(diary/uploads|records/images)/.*\.(php|php5|phtml|phar|pl|py|jsp|asp|sh|cgi)$ {
    deny  all;
    access_log off;
}

# 5) 只放行常规请求方法，屏蔽 PUT/DELETE/TRACE 等
if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
    return 405;
}

# 6) 常见扫描器/漏洞探测路径直接拒绝
location ~* (wp-login|xmlrpc|phpmyadmin|adminer|\.sql$|\.bak$|\.swp$|\.old$|/.env) {
    deny  all;
    access_log off;
}

# 7) 安全响应头
add_header X-Content-Type-Options    "nosniff"       always;
add_header X-Frame-Options           "SAMEORIGIN"    always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
# 全站 HTTPS 稳定后再打开下面这行（否则可能导致 http 打不开）
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# 内容安全策略：注意本页用了内联脚本，需要 unsafe-inline，按需开启
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:" always;

# 8) 并发与频率限制
limit_conn  perip 50;
limit_req   zone=site burst=60 nodelay;

# 9) 存档接口单独限速（必须同时把 PHP 解析带上，否则接口会 404/下载源码）
#    ⚠ 把 enable-php-80.conf 换成你实际的 PHP 版本文件
location = /xuanmen-save/save.php {
    limit_req zone=xm_api burst=5 nodelay;
    include enable-php-80.conf;
}

# 10) 静态资源缓存（顺带减轻服务器压力）
location ~* \.(jpg|jpeg|png|gif|webp|svg|css|js|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# 11) 隐藏 Nginx 版本号（在 nginx.conf 的 http{} 里加：server_tokens off;）
