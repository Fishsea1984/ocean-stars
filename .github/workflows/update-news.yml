name: 定时更新新闻

on:
  schedule:
    # UTC 时间；北京时间为 +8，即每天 09:17 / 15:17 / 21:17 各更新一次
    - cron: '17 1,7,13 * * *'
  workflow_dispatch:      # 也允许在网页端手动点「Run workflow」立即更新

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 RSS 生成 news.json
        run: python scripts/update_news.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/news.json
          if git diff --staged --quiet; then
            echo "新闻无变化，跳过提交"
          else
            git commit -m "chore: 定时更新新闻 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
