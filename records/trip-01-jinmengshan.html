            color: var(--text-secondary);

        .photo-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            transition: all 0.3s;

        .photo-item:hover {

            background: rgba(0, 0, 0, 0.92);

        const dayInfo = {
            1: { title: "启程", subtitle: "长治出发，踏上旅途" },
            2: { title: "古韵", subtitle: "山西古建，历史回响" },
            3: { title: "旷野", subtitle: "向北前行，旷野风光" },
            4: { title: "青城", subtitle: "呼和浩特，青色之城" },
            5: { title: "大漠", subtitle: "响沙湾，大漠孤烟" },
            6: { title: "文脉", subtitle: "陕西文脉，千年古都" },
            7: { title: "初心", subtitle: "延安革命，初心之旅" },
            8: { title: "归途", subtitle: "满载而归，温暖回家" }
        };

        // 所有照片的扁平列表（用于灯箱导航）
        let allPhotos = [];
        Object.keys(daysData).forEach(d => {
            daysData[d].forEach(src => {
                allPhotos.push({ day: parseInt(d), src: src });
            });
        });

        let currentPhotoIndex = 0;

        // 渲染照片
        function renderPhotos() {
            const container = document.getElementById('photoContainer');
            let html = '';
            for (let day = 1; day <= 8; day++) {
                const photos = daysData[day] || [];
                const info = dayInfo[day];
                html += `<div class="day-section" id="day-${day}">`;
                html += `<div class="day-header">`;
                html += `<div class="day-badge">D${day}</div>`;
                html += `<div>`;
                html += `<div class="day-title">${info.title}</div>`;
                html += `<div class="day-subtitle">${info.subtitle}</div>`;
                html += `</div>`;
                html += `<div class="day-count">${photos.length} 张照片</div>`;
                html += `</div>`;
                html += `<div class="photo-grid">`;
                photos.forEach((src, i) => {
                    const globalIndex = allPhotos.findIndex(p => p.src === src);
                    html += `<div class="photo-item" onclick="openLightbox(${globalIndex})">`;
                    html += `<img src="${src}" alt="D${day} - ${i+1}" loading="lazy">`;
                    html += `</div>`;
                });
                html += `</div>`;
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        // 灯箱
        function openLightbox(index) {
            currentPhotoIndex = index;
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
        }

        function updateLightbox() {
            const photo = allPhotos[currentPhotoIndex];
            document.getElementById('lightboxImg').src = photo.src;
            document.getElementById('lightboxCounter').textContent =
                `D${photo.day} · ${currentPhotoIndex + 1} / ${allPhotos.length}`;
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function navLightbox(dir) {
            currentPhotoIndex += dir;
            if (currentPhotoIndex < 0) currentPhotoIndex = allPhotos.length - 1;
            if (currentPhotoIndex >= allPhotos.length) currentPhotoIndex = 0;
            updateLightbox();
        }

        // 事件绑定
        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
        document.getElementById('lightboxPrev').addEventListener('click', (e) => { e.stopPropagation(); navLightbox(-1); });
        document.getElementById('lightboxNext').addEventListener('click', (e) => { e.stopPropagation(); navLightbox(1); });
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navLightbox(-1);
            if (e.key === 'ArrowRight') navLightbox(1);
        });

        // 天数导航
        document.querySelectorAll('.day-nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.day-nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const day = btn.dataset.day;
                document.getElementById('day-' + day).scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });

        // 滚动高亮
        window.addEventListener('scroll', () => {
            const sections = document.querySelectorAll('.day-section');
            let current = 1;
            sections.forEach(s => {
                const rect = s.getBoundingClientRect();
                if (rect.top < 120) current = parseInt(s.id.split('-')[1]);
            });
            document.querySelectorAll('.day-nav-item').forEach(b => {
                b.classList.toggle('active', b.dataset.day == current);
            });
        });

        // 初始化
        renderPhotos();
    </script>
    <script src="../js/main.js"></script>
</body>
</html>
